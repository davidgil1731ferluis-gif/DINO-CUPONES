name: Deploy DinoCupones to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        shell: bash
        run: |
          cp js/app.js /tmp/app.mjs
          cp js/firebase-service.js /tmp/firebase-service.mjs
          cp js/integrations-config.js /tmp/integrations-config.mjs
          cp worker/src/index.js /tmp/worker.mjs
          node --check /tmp/app.mjs
          node --check /tmp/firebase-service.mjs
          node --check /tmp/integrations-config.mjs
          node --check /tmp/worker.mjs
          node --check tests/ui-contract.mjs
          node tests/ui-contract.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
