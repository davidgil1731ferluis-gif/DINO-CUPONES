name: Apply DinoCupones PNG intro patch
on:
  push:
    paths:
      - ".patch/READY3"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify prepared patch
        shell: bash
        run: |
          cat .patch/chunks3/part.* | tr -d '\n' | base64 -d > /tmp/dinopatch.tar.gz
          tar -tzf /tmp/dinopatch.tar.gz >/dev/null
          tar -xzf /tmp/dinopatch.tar.gz -C .
          rm -rf .patch
          rm -f .github/workflows/apply-intro-patch.yml
      - name: Commit final application files
        shell: bash
        run: |
          git config user.name "DinoCupones Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Replace intro with animated PNG triceratops experience"
          git push
