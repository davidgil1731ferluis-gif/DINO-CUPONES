name: Materialize DinoCupones polish
on:
  push:
    paths:
      - ".build/READY"
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build updated frontend files
        shell: bash
        run: |
          cat .build/app.b64.* | tr -d '\n' | base64 -d > js/app.js
          cat .build/styles.b64.* | tr -d '\n' | base64 -d > styles.css
          rm -rf .build
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "DinoCupones Bot"
          git config user.email "actions@users.noreply.github.com"
          git add js/app.js styles.css .build
          git commit -m "Apply visual polish and optimized interactions"
          git push
